<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tebak Hero ML</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 22px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-bottom: 7px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .number {
      opacity: 0.6;
      margin-bottom: 15px;
    }

    .clue {
      background: rgba(0,0,0,0.2);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      text-align: left;
      font-size: 14px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .option {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 15px 8px;
      border-radius: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .option:hover {
      background: rgba(255,255,255,0.2);
    }

    .correct {
      background: #166534 !important;
    }

    .wrong {
      background: #991b1b !important;
    }

    #result {
      margin-top: 18px;
      min-height: 25px;
      font-weight: bold;
    }

    #nextBtn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 13px;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .score {
      margin-top: 20px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>🎮 Tebak Hero ML</h1>

    <p class="subtitle">
      Seberapa hafal lu sama hero ML? 😈
    </p>

    <div class="number" id="number"></div>

    <div id="clues"></div>

    <div class="options" id="options"></div>

    <div id="result"></div>

    <button id="nextBtn">
      ➡️ SOAL BERIKUTNYA
    </button>

    <div class="score">
      🏆 Score: <span id="score">0</span>
    </div>

  </div>


  <script>

    // =========================
    // DATA SOAL
    // =========================

    const questions = [

      {
        answer: "fanny",

        clues: [
          "🗡️ Seorang assassin yang sangat bergantung pada penguasaan mekanik.",
          "⚡ Mobilitasnya sangat dipengaruhi oleh medan di sekitarnya.",
          "🪢 Senjatanya memungkinkan dirinya berpindah dengan sangat cepat."
        ],

        options: [
          "Fanny",
          "Ling",
          "Gusion",
          "Hayabusa"
        ]
      },


      {
        answer: "estes",

        clues: [
          "🌙 Berasal dari bangsa yang memiliki hubungan erat dengan bulan.",
          "💚 Kekuatan utamanya lebih terasa ketika berada dekat dengan rekan satu tim.",
          "✨ Sangat dikenal karena kemampuannya membantu memulihkan HP tim."
        ],

        options: [
          "Estes",
          "Rafaela",
          "Floryn",
          "Angela"
        ]
      },


      {
        answer: "franco",

        clues: [
          "❄️ Berasal dari wilayah yang terkenal dengan iklim dinginnya.",
          "🪝 Salah satu kemampuannya dapat mengubah posisi lawan secara paksa.",
          "⚓ Sosoknya identik dengan senjata berbentuk kait."
        ],

        options: [
          "Franco",
          "Atlas",
          "Minotaur",
          "Tigreal"
        ]
      },


      {
        answer: "gusion",

        clues: [
          "🗡️ Menggunakan senjata kecil dalam jumlah banyak.",
          "⚡ Gameplay-nya terkenal dengan kombinasi skill yang cepat.",
          "🏰 Berasal dari keluarga yang memiliki tradisi sebagai bangsawan."
        ],

        options: [
          "Gusion",
          "Lancelot",
          "Julian",
          "Aamon"
        ]
      },


      {
        answer: "layla",

        clues: [
          "🔫 Senjatanya membuatnya mampu menyerang dari jarak yang sangat jauh.",
          "🌌 Kemampuan ultimate-nya dapat memberikan damage dari jarak ekstrem.",
          "🎯 Salah satu cirinya adalah semakin jauh jaraknya dari lawan, semakin efektif serangannya."
        ],

        options: [
          "Layla",
          "Miya",
          "Lesley",
          "Beatrix"
        ]
      },


      {
        answer: "ling",

        clues: [
          "🏯 Sangat identik dengan kemampuan bergerak di atas dinding.",
          "🗡️ Menggunakan pedang sebagai senjata utama.",
          "⚡ Mobilitasnya membuatnya sering muncul tiba-tiba dari arah yang tidak terduga."
        ],

        options: [
          "Ling",
          "Hayabusa",
          "Fanny",
          "Lancelot"
        ]
      },


      {
        answer: "angela",

        clues: [
          "🧸 Penampilannya terlihat seperti boneka.",
          "💗 Salah satu kemampuan khasnya memungkinkan dirinya membantu rekan dari jarak jauh.",
          "✨ Sangat bergantung pada rekan tim untuk memaksimalkan kemampuannya."
        ],

        options: [
          "Angela",
          "Floryn",
          "Nana",
          "Rafaela"
        ]
      }

    ];


    // =========================
    // VARIABLE
    // =========================

    let currentQuestion = 0;
    let score = 0;
    let answered = false;


    // =========================
    // ELEMENT
    // =========================

    const clues = document.getElementById("clues");
    const options = document.getElementById("options");
    const result = document.getElementById("result");
    const scoreText = document.getElementById("score");
    const number = document.getElementById("number");
    const nextBtn = document.getElementById("nextBtn");


    // =========================
    // TAMPILKAN SOAL
    // =========================

    function showQuestion() {

      answered = false;

      const question = questions[currentQuestion];

      number.textContent =
        `Soal ${currentQuestion + 1} / ${questions.length}`;

      clues.innerHTML = "";
      options.innerHTML = "";

      result.textContent = "";
      nextBtn.style.display = "none";


      // Tampilkan clue

      question.clues.forEach(function(clue) {

        const div = document.createElement("div");

        div.className = "clue";

        div.textContent = clue;

        clues.appendChild(div);

      });


      // Tampilkan pilihan

      question.options.forEach(function(option) {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.addEventListener("click", function() {

          checkAnswer(option, button);

        });

        options.appendChild(button);

      });
    }


    // =========================
    // CEK JAWABAN
    // =========================

    function checkAnswer(selected, clickedButton) {

      if (answered) return;

      answered = true;

      const correctAnswer =
        questions[currentQuestion].answer;


      // Matikan semua tombol

      const allButtons =
        document.querySelectorAll(".option");

      allButtons.forEach(function(button) {

        button.disabled = true;

      });


      if (selected.toLowerCase() === correctAnswer) {

        clickedButton.classList.add("correct");

        result.textContent =
          "🎉 BENARRR BROKK!! 🔥";

        score++;

        scoreText.textContent = score;

      } else {

        clickedButton.classList.add("wrong");

        result.textContent =
          `❌ SALAH 😭 Jawabannya ${correctAnswer.toUpperCase()}`;

        // Tunjukkan jawaban benar

        allButtons.forEach(function(button) {

          if (
            button.textContent.toLowerCase()
            === correctAnswer
          ) {
            button.classList.add("correct");
          }

        });

      }


      nextBtn.style.display = "block";
    }


    // =========================
    // NEXT QUESTION
    // =========================

    nextBtn.addEventListener("click", function() {

      currentQuestion++;

      if (currentQuestion >= questions.length) {

        clues.innerHTML =
          "<h2>🏆 QUIZ SELESAI!</h2>";

        options.innerHTML = "";

        result.textContent =
          `Score lu: ${score}/${questions.length} 😭🔥`;

        number.textContent = "FINISH";

        nextBtn.style.display = "none";

        return;
      }

      showQuestion();

    });


    // Mulai game

    showQuestion();

  </script>

</body>
</html>
