<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tebak Hero ML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffc857;
    --gold-dim:#8a6a2c;
    --gold-text:#b8791c;
    --cyan:#4fe3ff;
    --cyan-text:#0f8fa8;
    --pink:#ff4f8b;
    --pink-text:#d6247a;
    --green:#3ddc84;
    --green-text:#1f9e5a;
    --panel: rgba(255,255,255,0.55);
    --panel-border: rgba(255,255,255,0.85);
    --text:#3a2a5c;
    --text-dim:#7a6598;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    font-family:'Rajdhani',sans-serif;
    color:var(--text);
    overflow-x:hidden;
    position:relative;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
    min-height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:linear-gradient(160deg, #a7c6f5 0%, #c3b2ee 40%, #e7b7e8 70%, #ffd3ea 100%);
  }

  .bg-scene{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-scene svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .bg-frame{
    position:fixed;
    inset:14px;
    z-index:0;
    border:2px solid rgba(255,255,255,0.75);
    border-radius:6px;
    pointer-events:none;
  }

  .blob{ animation: blobDrift 9s ease-in-out infinite; transform-origin:center; }
  .blob.b2{ animation-duration:11s; animation-delay:.5s; }
  @keyframes blobDrift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(8px,-10px) scale(1.05); }
  }

  .ring{ animation: ringSpin 16s linear infinite; transform-origin:center; }
  .ring.r2{ animation-duration:20s; animation-direction:reverse; }
  @keyframes ringSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .dot{ animation: dotPulse 3s ease-in-out infinite; transform-origin:center; }
  @keyframes dotPulse{
    0%,100%{ transform:scale(1); opacity:0.85; }
    50%{ transform:scale(1.35); opacity:1; }
  }

  .square{ animation: squareFloat 5s ease-in-out infinite; transform-origin:center; }
  @keyframes squareFloat{
    0%,100%{ transform:translateY(0) rotate(var(--rot,15deg)); opacity:0.65; }
    50%{ transform:translateY(-14px) rotate(calc(var(--rot,15deg) + 12deg)); opacity:1; }
  }

  .halftone{ animation: haloSpin 24s linear infinite; transform-origin:center; }
  @keyframes haloSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .cloud{ animation: cloudBob 6s ease-in-out infinite; }
  @keyframes cloudBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:32px 16px 48px;
  }

  .hero{text-align:center;margin-bottom:18px;}
  .hero .kicker{
    font-family:'Orbitron',sans-serif;
    font-size:11px;
    letter-spacing:4px;
    color:#3a2a5c;
    text-shadow:0 1px 6px rgba(255,255,255,0.5);
  }
  .hero h1{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(24px,7.5vw,32px);
    margin-top:8px;
    background:linear-gradient(90deg,#3a2a5c 10%,#ff5fa2 55%,#3a2a5c 90%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s linear infinite;
    filter:drop-shadow(0 2px 8px rgba(255,255,255,0.55));
  }
  @keyframes shine{ to{ background-position:-220% center; } }
  .hero p{color:#4a3a70;font-size:14px;margin-top:6px;font-weight:700;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;
    font-family:'Orbitron',sans-serif;
    font-size:11px;
    color:#3a2a5c;
    letter-spacing:1px;
    text-shadow:0 1px 6px rgba(255,255,255,0.5);
  }
  .topbar .streak{color:#c9430c;}
  .progress-track{
    height:6px;border-radius:5px;background:rgba(255,255,255,0.35);
    overflow:hidden;margin-bottom:20px;
  }
  .progress-fill{
    height:100%;border-radius:5px;width:0%;
    background:linear-gradient(90deg,var(--cyan),var(--gold));
    transition:width .5s ease;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 28px rgba(120,90,180,0.18);
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#ff8fd0,transparent);
    opacity:0.8;
  }

  .clue-slots{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .clue{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(180,150,220,0.35);
    padding:13px 14px;
    border-radius:13px;
    text-align:left;
    font-size:14px;
    line-height:1.4;
    color:var(--text);
    opacity:0;
    transform:translateY(8px);
    animation:clueIn .45s ease forwards;
  }
  @keyframes clueIn{ to{opacity:1;transform:translateY(0);} }
  .clue .tag{
    display:inline-block;
    font-family:'Orbitron',sans-serif;
    font-size:9px;
    letter-spacing:1px;
    color:var(--cyan-text);
    margin-bottom:5px;
  }

  #moreClueBtn{
    width:100%;
    border:1.5px dashed rgba(120,90,180,0.4);
    background:rgba(191,233,255,0.35);
    color:var(--cyan-text);
    padding:12px;
    border-radius:12px;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.5px;
    cursor:pointer;
    margin-top:6px;
    transition:transform .15s ease, opacity .2s ease;
  }
  #moreClueBtn:active{transform:scale(0.98);}
  #moreClueBtn:disabled{
    opacity:0.5;
    cursor:default;
    color:var(--text-dim);
    border-color:rgba(120,90,180,0.25);
    background:transparent;
  }

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:6px;
  }
  .option{
    background:rgba(255,255,255,0.5);
    color:var(--text);
    border:1px solid rgba(150,120,200,0.3);
    padding:15px 8px;
    border-radius:13px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Rajdhani',sans-serif;
    cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .option:not(:disabled):active{transform:scale(0.97);}
  .option:not(:disabled):hover{background:rgba(255,255,255,0.85);}
  .option.correct{background:rgba(61,220,132,0.85) !important;border-color:var(--green);color:#08240f;}
  .option.wrong{background:rgba(255,79,139,0.8) !important;border-color:var(--pink);color:#2a0512;}
  .option:disabled{cursor:default;}

  #result{
    margin-top:16px;
    min-height:22px;
    font-weight:700;
    font-size:15px;
    text-align:center;
  }
  #result.correct-text{color:var(--green-text);}
  #result.wrong-text{color:var(--pink-text);}

  .points-badge{
    display:inline-block;
    font-family:'Orbitron',sans-serif;
    font-size:10px;
    color:var(--gold-text);
    margin-left:6px;
  }

  #nextBtn{
    width:100%;
    padding:15px;
    margin-top:14px;
    border:none;
    border-radius:14px;
    font-family:'Orbitron',sans-serif;
    font-size:15px;
    font-weight:800;
    letter-spacing:1px;
    color:#1a0e33;
    background:linear-gradient(100deg,var(--gold),#ffe08a,var(--gold));
    box-shadow:0 6px 18px rgba(255,150,60,0.35);
    cursor:pointer;
    display:none;
    transition:transform .15s ease;
  }
  #nextBtn:active{transform:scale(0.97);}

  .score-panel{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Orbitron',sans-serif;
  }
  .score-panel .label{font-size:11px;color:var(--text-dim);letter-spacing:1px;}
  .score-panel .value{font-size:22px;color:var(--gold-text);margin-top:3px;}

  /* FINISH SCREEN */
  .finish{text-align:center;}
  .finish .rank-badge{font-size:56px;margin-bottom:6px;filter:drop-shadow(0 4px 10px rgba(120,90,180,0.35));}
  .finish .rank-title{
    font-family:'Orbitron',sans-serif;
    font-size:22px;
    color:var(--gold-text);
    margin-bottom:4px;
  }
  .finish .rank-sub{color:var(--text-dim);font-size:14px;margin-bottom:16px;}
  .finish .final-score{
    font-family:'Orbitron',sans-serif;
    font-size:15px;
    color:var(--text);
    margin-bottom:18px;
  }
  #restartBtn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    font-family:'Orbitron',sans-serif;
    font-size:15px;
    font-weight:800;
    letter-spacing:1px;
    color:#0a3a44;
    background:linear-gradient(100deg,var(--cyan),#c8f6ff,var(--cyan));
    box-shadow:0 6px 18px rgba(79,200,227,0.35);
    cursor:pointer;
  }
  #restartBtn:active{transform:scale(0.97);}

  .footer{
    text-align:center;color:#4a3a70;font-size:11px;
    opacity:0.75;margin-top:20px;letter-spacing:1px;
    text-shadow:0 1px 6px rgba(255,255,255,0.5);
  }

  .float-pop{
    position:fixed;z-index:5;pointer-events:none;
    font-family:'Orbitron',sans-serif;
    font-weight:800;font-size:15px;
    animation: rise 1.4s ease-out forwards;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(1);opacity:1;}
    100%{transform:translateY(-90px) scale(1.2);opacity:0;}
  }
</style>
</head>
<body>

<div class="bg-scene">
  <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- soft blobs -->
    <ellipse class="blob b1" cx="30" cy="120" rx="150" ry="95" fill="#bfe9ff" opacity="0.55"/>
    <ellipse class="blob b2" cx="0" cy="700" rx="140" ry="120" fill="#ff9fd0" opacity="0.55"/>

    <circle class="ring r1" cx="300" cy="90" r="30" fill="none" stroke="#ff8fd0" stroke-width="5" opacity="0.75" style="transform-origin:300px 90px;"/>

    <circle class="dot" cx="165" cy="95" r="5" fill="#2f9fa8"/>

    <circle class="dot" cx="60" cy="480" r="7" fill="#8fd8ff" style="animation-delay:1.6s"/>

    <!-- tiny squares -->
    <rect class="square" x="55" y="150" width="11" height="11" fill="#ffffff" opacity="0.7" style="--rot:12deg; transform:rotate(12deg); transform-origin:60px 155px;"/>
    <rect class="square" x="95" y="175" width="9" height="9" fill="#ffffff" opacity="0.6" style="--rot:-10deg; transform:rotate(-10deg); transform-origin:99px 179px; animation-delay:.8s"/>
    <rect class="square" x="35" y="205" width="14" height="14" fill="#ffe07a" opacity="0.85" style="--rot:18deg; transform:rotate(18deg); transform-origin:42px 212px; animation-delay:1.4s"/>
    <rect class="square" x="210" y="140" width="10" height="10" fill="#ffffff" opacity="0.65" style="--rot:-16deg; transform:rotate(-16deg); transform-origin:215px 145px; animation-delay:.4s"/>
    <rect class="square" x="255" y="185" width="10" height="10" fill="#ffffff" opacity="0.6" style="--rot:10deg; transform:rotate(10deg); transform-origin:260px 190px; animation-delay:1.8s"/>

    <!-- cloud along the bottom -->
    <path class="cloud" fill="#fffaff" opacity="0.95" d="M0,800 L0,660 Q25,615 55,650 Q80,600 110,645 Q140,600 170,648 Q200,605 230,648 Q260,602 290,648 Q320,608 350,648 Q378,615 400,655 L400,800 Z"/>
  </svg>
</div>
<div class="bg-frame"></div>

<div class="wrap">

  <div class="hero">
    <div class="kicker">LAND OF DAWN </div>
    <h1>🎮 Tebak Hero ML</h1>
    <p>seberapa hafal km sama hero ML? 😁</p>
  </div>

  <div class="topbar">
    <span id="number">Soal 1 / 10</span>
    <span class="streak">🔥 Streak: <span id="streakNum">0</span></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="panel" id="quizPanel">
    <div class="clue-slots" id="clues"></div>
    <button id="moreClueBtn">🔍 Clue Berikutnya</button>

    <div class="options" id="options"></div>

    <div id="result"></div>

    <button id="nextBtn">➡️ SOAL BERIKUTNYA</button>
  </div>

  <div class="panel score-panel">
    <div>
      <div class="label">🏆 TOTAL SCORE</div>
      <div class="value" id="score">0</div>
    </div>
    <div style="text-align:right;">
      <div class="label">SEMAKIN CEPET NEBAK</div>
      <div class="label">SEMAKIN GEDE POINNYA ✨</div>
    </div>
  </div>

  <div class="panel finish" id="finishPanel" style="display:none;">
    <div class="rank-badge" id="finishBadge">🥉</div>
    <div class="rank-title" id="finishTitle">Warrior</div>
    <div class="rank-sub" id="finishSub">Lumayan tapi harus belajar lagi 😅</div>
    <div class="final-score" id="finishScore">Score: 0 / 0</div>
    <button id="restartBtn">🔁 MAIN LAGI</button>
  </div>

  <div class="footer">TEBAK HERO ML</div>

</div>

<script>
function spawnPop(x,y,text,color){
  const h = document.createElement('div');
  h.className = 'float-pop';
  h.textContent = text;
  h.style.left = (x-14)+'px';
  h.style.top = (y-10)+'px';
  h.style.color = color;
  document.body.appendChild(h);
  setTimeout(()=>h.remove(), 1450);
}

/* =========================
   DATA SOAL
========================= */
const questions = [
  {
    answer: "fanny",
    clues: [
      "🗡️ Seorang assassin high mekanik.",
      "⚡ butuh bgt buff biru.",
      "🪢 identik dengan kabela."
    ],
    options: ["Fanny","Ling","Gusion","Hayabusa"]
  },
  {
    answer: "estes",
    clues: [
      "🌙 skill 2 nya ngeslow pergerakan lawan.",
      "💚 dia seorang healer, gendernya cwk 😜.",
      "✨ klo pke hero ini, mainnya harus ngumpul truss."
    ],
    options: ["Estes","Rafaela","Floryn","Angela"]
  },
  {
    answer: "franco",
    clues: [
      "❄️ Berasal dari daerah yg dingin.",
      "🪝 ultinya ngestun 4 detik.",
      "⚓ suka mancing masalah."
    ],
    options: ["Franco","Atlas","Minotaur","Tigreal"]
  },
  {
    answer: "aamon",
    clues: [
      "🗡️ make senjata kecil dalam jumlah banyak.",
      "🏰 berasal dari keluarga bangsawan.",
      "⚡ terkenal dengan skill nya yg bisa ngilang."
    ],
    options: ["Gusion","Lancelot","Julian","Aamon"]
  },
  {
    answer: "layla",
    clues: [
      "🔫 basic attack nya jauh bgt.",
      "🌌 ultinya jauhh juga kek flameshot.",
      "🎯 Salah satu cirinya adalah semakin jauh jaraknya dari lawan, semakin sakit serangannya."
    ],
    options: ["Layla","Miya","Lesley","Beatrix"]
  },
  {
    answer: "ling",
    clues: [
      "🗡️ Menggunakan Menggunakan pedang sebagai senjata utama.",
      "⚡ sering muncul tiba-tiba1.",
      "🏯 identik dengan merayap kek cicak.",
    ],
  options: ["Ling","Hayabusa","Fanny", "Lancelot"]
  },
  {
    answer: "angela",
    clues: [
      "🧸 dia terlihat seperti boneka.",
      "💗 bisa masukin hero 👀.",
      "✨ healer favorit nya ryuッ 😆a."
    ],
    options: ["Angela","Floryn","Nana","Rafaela"]
  },
  {
    answer: "julian",
    clues: [
      "⛓️ Terkenal dengan rantai sebagai senjatanya.",
      "🧬 Memiliki hubungan dengan eksperimen dan kekuatan misterius.",
      "⚔️ Tidak memiliki ultimate biasa seperti kebanyakan hero."
    ],
    options: ["Julian","Aamon","Arlott","Paquito"]
  },
  {
    answer: "mathilda",
    clues: [
      "🪽 bisa jemput temenya.",
      "🌿 ultinya terbang.",
      "✨ Tebak woii, dah jelas ga sii."
    ],
    options: ["Mathilda","Rafaela","Floryn","Angela"]
  },
  {
    answer: "helcurt",
    clues: [
      "🌑 identik dengan kegelapan.",
      "👁️ bisa matiin lampu .",
      "☠️ julukan nya kecoa."
    ],
    options: ["Helcurt","Saber","Natalia","Hanzo"]
  }
];

/* shuffle so it's not the same order every play */
for(let i = questions.length - 1; i > 0; i--){
  const j = Math.floor(Math.random() * (i+1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

/* =========================
   STATE
========================= */
let currentQuestion = 0;
let score = 0;
let streak = 0;
let cluesRevealed = 0;
let answered = false;

/* =========================
   ELEMENTS
========================= */
const cluesEl = document.getElementById("clues");
const optionsEl = document.getElementById("options");
const resultEl = document.getElementById("result");
const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streakNum");
const numberEl = document.getElementById("number");
const nextBtn = document.getElementById("nextBtn");
const moreClueBtn = document.getElementById("moreClueBtn");
const progressFill = document.getElementById("progressFill");
const quizPanel = document.getElementById("quizPanel");
const finishPanel = document.getElementById("finishPanel");

/* =========================
   SHOW QUESTION
========================= */
function showQuestion(){
  answered = false;
  cluesRevealed = 0;

  const q = questions[currentQuestion];

  numberEl.textContent = `Soal ${currentQuestion + 1} / ${questions.length}`;
  progressFill.style.width = Math.round((currentQuestion / questions.length) * 100) + '%';

  cluesEl.innerHTML = "";
  optionsEl.innerHTML = "";
  resultEl.textContent = "";
  resultEl.className = "";
  nextBtn.style.display = "none";
  moreClueBtn.disabled = false;
  moreClueBtn.textContent = "🔍 Clue Berikutnya";

  revealClue();

  const shuffledOptions = [...q.options].sort(()=>Math.random()-0.5);
  shuffledOptions.forEach(function(option){
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option;
    button.addEventListener("click", function(e){
      checkAnswer(option, button, e);
    });
    optionsEl.appendChild(button);
  });
}

/* =========================
   REVEAL CLUE (one at a time)
========================= */
function revealClue(){
  const q = questions[currentQuestion];
  if(cluesRevealed >= q.clues.length) return;

  const div = document.createElement("div");
  div.className = "clue";
  div.innerHTML = `<span class="tag">CLUE ${cluesRevealed + 1}</span><br>${q.clues[cluesRevealed]}`;
  cluesEl.appendChild(div);
  cluesRevealed++;

  if(cluesRevealed >= q.clues.length){
    moreClueBtn.disabled = true;
    moreClueBtn.textContent = "✋ Clue Abis, tebak sekarang!";
  }
}
moreClueBtn.addEventListener("click", revealClue);

/* =========================
   CHECK ANSWER
========================= */
function checkAnswer(selected, clickedButton, evt){
  if(answered) return;
  answered = true;

  const correctAnswer = questions[currentQuestion].answer;
  const isCorrect = selected.toLowerCase() === correctAnswer;

  const allButtons = document.querySelectorAll(".option");
  allButtons.forEach(function(button){ button.disabled = true; });
  moreClueBtn.disabled = true;

  if(isCorrect){
    clickedButton.classList.add("correct");

    const points = Math.max(10, (4 - cluesRevealed) * 10);
    score += points;
    streak++;

    scoreEl.textContent = score;
    streakEl.textContent = streak;

    resultEl.className = "correct-text";
    resultEl.innerHTML = `🎉 YEYY BENARRR !! 🔥 <span class="points-badge">+${points} poin</span>`;

    if(evt) spawnPop(evt.clientX, evt.clientY, `+${points}`, '#3ddc84');
  } else {
    clickedButton.classList.add("wrong");
    streak = 0;
    streakEl.textContent = streak;

    resultEl.className = "wrong-text";
    resultEl.textContent = `❌ SALAH 😭 Jawabannya ${correctAnswer.toUpperCase()}`;

    allButtons.forEach(function(button){
      if(button.textContent.toLowerCase() === correctAnswer){
        button.classList.add("correct");
      }
    });

    if(evt) spawnPop(evt.clientX, evt.clientY, 'Yah 😭', '#ff4f8b');
  }

  nextBtn.style.display = "block";
}

/* =========================
   NEXT QUESTION / FINISH
========================= */
nextBtn.addEventListener("click", function(){
  currentQuestion++;

  if(currentQuestion >= questions.length){
    showFinish();
    return;
  }
  showQuestion();
});

function showFinish(){
  progressFill.style.width = '100%';
  quizPanel.style.display = "none";
  finishPanel.style.display = "block";

  const maxScore = questions.length * 30;
  const pct = score / maxScore;

  let badge, title, sub;
  if(pct >= 0.9){ badge="🐉"; title="Mythic"; sub="Beneran anak ML sejati 🔥"; }
  else if(pct >= 0.75){ badge="👑"; title="Legend"; sub="Hafalannya udah mantep banget 😎"; }
  else if(pct >= 0.6){ badge="🔮"; title="Epic"; sub="Lumayan jago, dikit lagi legend!"; }
  else if(pct >= 0.45){ badge="💠"; title="Grandmaster"; sub="Not bad, tapi masih bisa lebih 😤"; }
  else if(pct >= 0.3){ badge="🥇"; title="Master"; sub="Perlu nonton highlight hero lagi nih."; }
  else if(pct >= 0.15){ badge="🥈"; title="Elite"; sub="Lumayan tapi kudu belajar lagi 😅"; }
  else { badge="🥉"; title="Warrior"; sub="Wih baru mulai nih, gas hafalin hero yaa 🙈"; }

  document.getElementById('finishBadge').textContent = badge;
  document.getElementById('finishTitle').textContent = title;
  document.getElementById('finishSub').textContent = sub;
  document.getElementById('finishScore').textContent = `Score: ${score} / ${maxScore}`;
}

document.getElementById('restartBtn').addEventListener('click', function(){
  for(let i = questions.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  currentQuestion = 0;
  score = 0;
  streak = 0;
  scoreEl.textContent = 0;
  streakEl.textContent = 0;
  finishPanel.style.display = "none";
  quizPanel.style.display = "block";
  showQuestion();
});

/* Mulai game */
showQuestion();
</script>
